name: Build and Push Image

on:
  push:
    branches: [main]
  pull_request: # <-- NEW: Trigger on PRs targeting main
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Java App
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Podman Image
        # This runs on BOTH PRs and main merges to guarantee the Dockerfile works
        run: |
          IMAGE_TAG=${{ github.sha }}
          podman build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG -f Containerfile .

      - name: Push Podman Image to Registry
        # NEW: Only push the image if the PR was merged to main
        if: github.event_name == 'push'
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login $REGISTRY -u ${{ github.actor }} --password-stdin
          podman push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Update GitOps Repo
        # NEW: Only update ArgoCD if the PR was merged to main
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.actor }}/gitops-infra
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Push new image tag to GitOps Repo
        if: github.event_name == 'push'
        run: |
          cd gitops-repo
          sed -i "s|image: ghcr.io/${{ github.actor }}/java-hello-world:.*|image: ghcr.io/${{ github.actor }}/java-hello-world:${{ github.sha }}|g" deployment.yaml

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main
