name: Build and Push Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Java App
        run: ./mvnw clean package -DskipTests

      - name: Build Podman Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          podman build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG -f Containerfile .

          # Login to GitHub Container Registry using the default GITHUB_TOKEN
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login $REGISTRY -u ${{ github.actor }} --password-stdin
          podman push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Update GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.actor }}/gitops-infra
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Push new image tag to GitOps Repo
        run: |
          cd gitops-repo
          # This sed command finds the image line and updates the tag to the new git commit hash
          sed -i "s|image: ghcr.io/${{ github.actor }}/java-hello-world:.*|image: ghcr.io/${{ github.actor }}/java-hello-world:${{ github.sha }}|g" deployment.yaml

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main
